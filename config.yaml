cold_email:
  throttle_per_run: 3
action_items:
  stale_application_days: 14
  stale_cold_email_days: 6
  oa_reminder_minutes_before: [1440, 120]   # 24h and 2h before the OA due date (9am local)
  # Calibrated against a real job posting, not guessed: scores are inherently
  # low in absolute terms (top-50-JD-keyword overlap includes company/role
  # proper nouns like the company name itself, which a resume can't "match").
  # Measured: clearly-wrong-domain resume scored 0.02, a generically relevant
  # but untailored resume scored 0.14, a deliberately JD-tailored one scored
  # 0.24. 0.08 sits below the "plausible match" floor with some margin.
  jd_overlap_warning_threshold: 0.08
